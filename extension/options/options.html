<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lead Assist – Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Lead Assist settings</h1>
    <p class="muted">
      These settings sync with your Chrome profile. The API key is only sent as
      a <code>Authorization: Bearer</code> header to the base URL below.
    </p>

    <label for="api-base-url">API base URL</label>
    <input id="api-base-url" type="url" placeholder="https://api.example.com/v1" />

    <label for="api-key">API key</label>
    <input id="api-key" type="password" placeholder="Your API key (optional)" />

    <label for="items-path">Items endpoint path</label>
    <input id="items-path" type="text" placeholder="/items" />

    <h2>Bulk import</h2>

    <label for="users-path">Users endpoint path <span class="muted">(bulk add users → POST per row)</span></label>
    <input id="users-path" type="text" placeholder="/users" />

    <label for="status-path">Client status endpoint path <span class="muted">(bulk statuses → POST per row)</span></label>
    <input id="status-path" type="text" placeholder="/lead-statuses" />

    <label for="status-field">Status field name <span class="muted">(the key the picked status is sent as)</span></label>
    <input id="status-field" type="text" placeholder="status" />

    <label for="status-options">Status options <span class="muted">(comma-separated, shown in the picker)</span></label>
    <input id="status-options" type="text" placeholder="New, Reapply" />

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Save &amp; test connection</button>
    </div>

    <p id="status"></p>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
