<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lead Assist</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Lead Assist</h1>
    <button id="open-options" class="link" title="Settings">⚙ Settings</button>
  </header>

  <section id="status-bar">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">Not connected</span>
    <button id="test-connection" class="small">Test</button>
  </section>

  <section class="card">
    <h2>Active page</h2>
    <button id="read-page">Read current page</button>
    <div id="page-context" class="hidden">
      <dl>
        <dt>Title</dt><dd id="page-title"></dd>
        <dt>URL</dt><dd id="page-url"></dd>
        <dt>Selection</dt><dd id="page-selection"></dd>
        <dt>Emails</dt><dd id="page-emails"></dd>
        <dt>Phones</dt><dd id="page-phones"></dd>
      </dl>
      <button id="create-from-page">Create item from this page</button>
    </div>
  </section>

  <section class="card">
    <h2>Items</h2>
    <button id="refresh-items">Refresh</button>
    <ul id="items-list"></ul>
    <p id="items-empty" class="muted hidden">No items yet.</p>
  </section>

  <section class="card">
    <h2>Page tools</h2>
    <label for="selector-input">CSS selector</label>
    <input id="selector-input" type="text" placeholder='e.g. input[name="email"]' />
    <div class="row">
      <button id="highlight-btn">Highlight</button>
    </div>
    <label for="fill-value">Fill value</label>
    <input id="fill-value" type="text" placeholder="Value to insert" />
    <div class="row">
      <button id="fill-btn">Fill on page</button>
    </div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
